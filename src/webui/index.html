<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>gestured</title>
</head>

<body style="margin:0; background:#000000; min-height:100vh; display:flex; place-items:center; justify-content:center; gap:16px; overflow:hidden; color:white;">
    <!-- live confidence controls, separate thresholds for each model stage -->
    <div style="position:fixed; top:12px; left:12px; z-index:1; color:white; background:#222; padding:8px;">
        <label>palm confidence <input id="palm-confidence" type="range" min="0" max="1" step="0.01"><output id="palm-value"></output></label>
        <br>
        <label>landmark confidence <input id="landmark-confidence" type="range" min="0" max="1" step="0.01"><output id="landmark-value"></output></label>
        <br>
        <label>exposure <input id="exposure-control" type="range" min="1" max="10000" step="1"><output id="exposure-value"></output></label>
        <br>
        <label>gain <input id="gain-control" type="range" min="0" max="255" step="1"><output id="gain-value"></output></label>
    </div>
    <div style="position:relative; max-width:calc(100vw - 352px); max-height:100vh;">
        <img id="frame" style="display:block; max-width:100%; max-height:100vh;">
        <canvas id="overlay" style="position:absolute; top:0; left:0; width:100%; height:100%; pointer-events:none;"></canvas>
    </div>
    <div style="width:320px; height:calc(100vh - 24px); box-sizing:border-box; padding:12px; background:#222;">
        <button id="photograph-button" type="button">Photograph</button>
        <canvas id="photograph" width="296" height="296" style="display:block; margin-top:12px; background:#111;"></canvas>
        <p id="photograph-status">No photograph taken</p>
        <label>Gesture name <input id="gesture-name" type="text"></label>
        <button id="save-gesture-button" type="button">Save</button>
        <p id="save-gesture-status"></p>
        <div id="saved-gestures" style="display:flex; flex-wrap:wrap; gap:8px; margin-top:12px; text-align:center;"></div>
    </div>

    <script src="/tracking.js"></script>
    <script src="/photograph.js"></script>
    <script src="/app.js"></script>
</body>

</html>
